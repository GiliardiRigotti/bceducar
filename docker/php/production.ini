; Configuração PHP de produção. Limites de upload alinhados a docker/php/uploads.ini;
; a aplicação aplica BC_DOCUMENT_MAX_UPLOAD_KB.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 10M
post_max_size = 12M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; O código é montado por volume: revalida a cada 60 s para que um deploy não exija rebuild.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
